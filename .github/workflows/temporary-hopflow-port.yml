name: Temporary Hopflow file-transfer port

on:
  push:
    branches:
      - work/file-transfer

permissions:
  contents: write

concurrency:
  group: hopflow-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Deskflow fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Hopflow file-transfer commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A previous successful run leaves this marker. Avoid replaying the port
          # when later documentation or CI commits are pushed to the work branch.
          if git log --format=%B | grep -Fq "Port Hopflow file transfer"; then
            echo "Hopflow transfer port is already present."
            exit 0
          fi

          git remote add hopflow https://github.com/Eyad-Alqaysi/hopflow.git
          git fetch --no-tags hopflow main

          commits=(
            84a6153f95b18cb775ea432b16eea00c4ff77c8a
            303affbfe151d0439cc4c4e0c9978cdbc42e35f9
            7040b558bef8852bae8cc0a19288c74fe9a53c61
            29464f521f0e4e4328137e1bcffaf3a4bf800608
            11d25b76d160d0cad41702c6b8f1986dc0c34f54
            b37283303daae4241c9f6d1bf1ee820fdbd3a7a6
            4a5f31f12af33f04a9ad2f9132d5a09e27ef586c
          )

          for commit in "${commits[@]}"; do
            if git log --format=%B | grep -Fq "$commit"; then
              echo "Already applied: $commit"
              continue
            fi

            echo "::group::Cherry-pick $commit"
            if ! git -c core.whitespace=cr-at-eol cherry-pick --empty=drop -X theirs -x "$commit"; then
              echo "::error::Cherry-pick failed for $commit. No partial result will be pushed."
              git cherry-pick --abort || true
              exit 1
            fi
            echo "::endgroup::"
          done

          if ! git log --format=%s | grep -Fxq "Port Hopflow file transfer"; then
            git commit --allow-empty -m "Port Hopflow file transfer"
          fi

          git push origin HEAD:work/file-transfer
